<?xml version="1.0" encoding="UTF-8"?>
<!-- app icon for 16/32px. 15 thin lines turn into a gray smear there, so the logo -->
<!-- becomes a solid silhouette with one slit: 96 / 32 / 96 units = 3 / 1 / 3 px at 32px, -->
<!-- all on the pixel grid -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="plate" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3e4a52"/>
      <stop offset="1" stop-color="#293237"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.25" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.8" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="9" x2="0" y2="1052" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#bcbcbc"/>
      <stop offset="1" stop-color="#a0a0a0"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dy="6" result="blur"/>
      <feFlood flood-color="#000000" flood-opacity="0.35"/>
      <feComposite in2="blur" operator="in"/>
    </filter>
    <clipPath id="stripes">
      <rect x="100" y="384" width="824" height="96"/>
      <rect x="100" y="512" width="824" height="96"/>
    </clipPath>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="#000000" filter="url(#dropShadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#plate)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <!-- stroke 72 > line pitch 69.35, so the lines merge into a solid silhouette. -->
  <!-- silhouette spans y 9..1052 in logo space, scaled to 224 units at y 384 -->
  <g clip-path="url(#stripes)">
    <g transform="translate(161.8 382.07) scale(0.2148)">
      <path fill="none" stroke="url(#ink)" stroke-width="72" stroke-linecap="butt" stroke-linejoin="round"
